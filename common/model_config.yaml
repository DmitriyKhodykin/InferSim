models:
  - name: "Qwen3-32B-FP16"
    config_path: "hf_configs/qwen3_32b_config.json"   # путь относительно back
    num_layers: 64
    num_kv_heads: 8
    head_dim: 80
    dtype_bytes: 2
    weight_gb: 65.6
    overhead_gb: 13.1

  - name: "Qwen3-30B-A3B-FP16"
    config_path: "hf_configs/qwen3-30B-A3B_config.json"
    num_layers: 48
    num_kv_heads: 4
    head_dim: 128
    dtype_bytes: 2
    weight_gb: 55.9      # ~30B параметров * 2 байта / (1024^3)
    overhead_gb: 11.2    # ~20% от весов

  - name: "Qwen3.5-9B-FP16"
    config_path: "hf_configs/qwen3_5_9b_config.json"
    # Временная аппроксимация для оценки параллельности:
    num_layers: 8            # только слои с полным вниманием (1 из каждых 4)
    num_kv_heads: 4
    head_dim: 256
    # Реальные параметры гибридной архитектуры (пока не используются в estimate_max_parallel):
    num_full_attn_layers: 8
    num_linear_attn_layers: 24
    linear_num_key_heads: 16
    linear_num_value_heads: 32
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_feature_dim: 128
    dtype_bytes: 2
    weight_gb: 16.8
    overhead_gb: 3.4

  - name: "Bamba-9B-v2-FP16"
    config_path: "hf_configs/bamba_9b_v2_config.json"
    num_layers: 32
    num_kv_heads: 8
    head_dim: 256
    dtype_bytes: 2
    weight_gb: 18.5
    overhead_gb: 3.7
    # Кастомные MFU, подтверждённые тестами на H100
    mfu_prefill_override: 0.7
    mfu_decode_override: 0.5

  - name: "Llama-3.1-8B-FP16"
    config_path: "hf_configs/llama_3_1_8b_config.json"
    num_layers: 32
    num_kv_heads: 8
    head_dim: 128
    dtype_bytes: 2
    weight_gb: 16.0   # 8B параметров × 2 байта / (1024³)
    overhead_gb: 3.2   # ~20% от весов под активации и буферы
    mfu_prefill_override: 0.9   # стандартное значение
    mfu_decode_override: 0.4
  
  - name: "Qwen3.6-35B-A3B-FP16"
    config_path: "hf_configs/qwen3_6_35b_a3b_config.json"
    num_layers: 40
    num_kv_heads: 2
    head_dim: 256
    dtype_bytes: 2
    weight_gb: 65.6
    overhead_gb: 13.1
    # Параметры гибридной архитектуры (HybridModel)
    num_full_attn_layers: 10
    num_linear_attn_layers: 30
    linear_num_key_heads: 16
    linear_num_value_heads: 32
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_feature_dim: 128
    # Дополнительные параметры для точности симуляции
    rope_theta: 10000000
    partial_rotary_factor: 0.25
    mrope_interleaved: true
    # Мультимодальные токены (если симулятор учитывает vision)
    image_token_id: 248056
    video_token_id: 248057
    vision_start_token_id: 248053
    vision_end_token_id: 248054