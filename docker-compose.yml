services:
  streamlit:
    image: infersim-dashboard
    expose:
      - "8501"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./certs/private/privkey.pem:/etc/ssl/private/privkey.pem:ro
    depends_on:
      - streamlit
    restart: unless-stopped